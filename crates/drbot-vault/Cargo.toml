[package]
name = "drbot-vault"
version = "0.1.0"
edition = "2021"
description = "Encrypted local storage for sensitive data"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
ring = "0.17"
base64 = "0.21"

[dev-dependencies]
tokio-test = "0.4"

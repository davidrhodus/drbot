env:
  CARGO_TERM_COLOR: always

jobs:
  kani-verification:
    name: Kani Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: stable

      - name: Install Kani
        uses: model-checking/kani-github-action@v1.1

      - name: Cache Kani
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/kani*
            ~/.cargo/bin/cargo-kani
          key: kani-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify drbot-kani (standalone proofs)
        run: cargo kani --package drbot-kani
        continue-on-error: false

      - name: Verify drbot-core
        run: cargo kani --package drbot-core
        continue-on-error: false

      - name: Verify drbot-memory
        run: cargo kani --package drbot-memory
        continue-on-error: false


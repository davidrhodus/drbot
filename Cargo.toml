[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["David"]
license = "MIT"
repository = "https://github.com/david/drbot"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
async-recursion = "1.1"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream", "native-tls", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Config
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Crypto
ring = "0.17"
rustls = "0.23"
jsonwebtoken = "9"

# Image processing
image = "0.25"

# UUID
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# Regex
regex = "1.11"

# Bytes
bytes = "1.9"

# Archives / Compression
flate2 = "1.0"
tar = "0.4"
zip = "2"

# Docker
bollard = "0.18"

# mDNS/Bonjour
mdns-sd = "0.11"

# WebSocket client
rust_socketio = "0.6"

# Solana
solana-sdk = "2.0"
solana-client = "2.0"
spl-token = "6.0"
spl-associated-token-account = "4.0"
bs58 = "0.5"
base64 = "0.22"
bincode = "1.3"
lazy_static = "1.5"

